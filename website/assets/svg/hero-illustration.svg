<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7D8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A69CAC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6B89C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BB5C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8D4C2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="80" cy="60" r="40" fill="url(#heroGrad3)" opacity="0.3"/>
  <circle cx="320" cy="80" r="30" fill="url(#heroGrad2)" opacity="0.4"/>
  <circle cx="350" cy="220" r="35" fill="url(#heroGrad1)" opacity="0.2"/>
  
  <!-- Main figure - elegant woman silhouette -->
  <path d="M200 50 C220 50 240 70 240 90 C240 110 230 125 215 130 L215 160 C215 165 220 170 225 170 L225 200 C225 210 215 220 205 220 L195 220 C185 220 175 210 175 200 L175 170 C180 170 185 165 185 160 L185 130 C170 125 160 110 160 90 C160 70 180 50 200 50 Z" fill="url(#heroGrad1)" opacity="0.8"/>
  
  <!-- Decorative elements representing beauty and growth -->
  <g transform="translate(50, 150)">
    <!-- Flower petals -->
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(0)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(120)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(180)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(240)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="20" fill="url(#heroGrad2)" opacity="0.6" transform="rotate(300)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="url(#heroGrad1)"/>
  </g>
  
  <!-- Psychology symbols - brain neurons -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="4" fill="url(#heroGrad3)"/>
    <circle cx="15" cy="-10" r="3" fill="url(#heroGrad3)"/>
    <circle cx="25" cy="5" r="3.5" fill="url(#heroGrad3)"/>
    <circle cx="10" cy="15" r="2.5" fill="url(#heroGrad3)"/>
    <!-- Connections -->
    <line x1="3" y1="-2" x2="12" y2="-8" stroke="url(#heroGrad1)" stroke-width="2" opacity="0.6"/>
    <line x1="3" y1="3" x2="22" y2="3" stroke="url(#heroGrad1)" stroke-width="2" opacity="0.6"/>
    <line x1="2" y1="4" x2="8" y2="13" stroke="url(#heroGrad1)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Growth arrow -->
  <g transform="translate(150, 220)">
    <path d="M0 30 L0 5 L-8 12 M0 5 L8 12" stroke="url(#heroGrad2)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="15" y="20" fill="url(#heroGrad1)" font-size="12" font-weight="300">成长</text>
  </g>
  
  <!-- Beauty symbols -->
  <g transform="translate(100, 100)">
    <!-- Mirror reflection -->
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="none" stroke="url(#heroGrad2)" stroke-width="2" opacity="0.7"/>
    <ellipse cx="2" cy="2" rx="15" ry="20" fill="url(#heroGrad3)" opacity="0.3"/>
  </g>
</svg>