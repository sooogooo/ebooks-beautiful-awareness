<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beautyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7D8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Flower of beauty -->
  <g transform="translate(50, 50)">
    <!-- Outer petals -->
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(0)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(45)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(90)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(135)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(180)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(225)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(270)"/>
    <ellipse cx="0" cy="-20" rx="6" ry="15" fill="url(#beautyGrad)" opacity="0.8" transform="rotate(315)"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8" fill="#E6B89C"/>
    <circle cx="0" cy="0" r="4" fill="#D4A574"/>
  </g>
</svg>