<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="assessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BB5C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7D8C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clipboard with checklist -->
  <g transform="translate(50, 50)">
    <!-- Clipboard background -->
    <rect x="-18" y="-25" width="36" height="45" rx="3" fill="url(#assessGrad)" opacity="0.2"/>
    <rect x="-15" y="-22" width="30" height="39" rx="2" fill="#FEFEFE" stroke="url(#assessGrad)" stroke-width="1"/>
    
    <!-- Clip at top -->
    <rect x="-6" y="-28" width="12" height="6" rx="2" fill="url(#assessGrad)"/>
    
    <!-- Checklist items -->
    <g fill="none" stroke="#8B7D8C" stroke-width="1.5">
      <!-- Checkboxes -->
      <rect x="-10" y="-15" width="4" height="4" rx="1"/>
      <rect x="-10" y="-8" width="4" height="4" rx="1"/>
      <rect x="-10" y="-1" width="4" height="4" rx="1"/>
      <rect x="-10" y="6" width="4" height="4" rx="1"/>
      
      <!-- Check marks -->
      <path d="M-9 -13 L-8 -12 L-7 -14" stroke="#B8D4C2" stroke-width="2"/>
      <path d="M-9 -6 L-8 -5 L-7 -7" stroke="#B8D4C2" stroke-width="2"/>
      
      <!-- Lines representing text -->
      <line x1="-4" y1="-13" x2="8" y2="-13" stroke="#D4A574" opacity="0.6"/>
      <line x1="-4" y1="-6" x2="6" y2="-6" stroke="#D4A574" opacity="0.6"/>
      <line x1="-4" y1="1" x2="10" y2="1" stroke="#A69CAC" opacity="0.4"/>
      <line x1="-4" y1="8" x2="7" y2="8" stroke="#A69CAC" opacity="0.4"/>
    </g>
  </g>
</svg>